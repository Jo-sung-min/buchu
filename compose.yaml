services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: buchu
      POSTGRES_USER: ${DB_USERNAME:-buchu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - buchu-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d buchu"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  buchu-postgres:

spring:
  application:
    name: buchu-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/buchu}
    username: ${DB_USERNAME:buchu}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${PORT:8082}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
  tomcat:
    max-http-form-post-size: 1MB

buchu:
  catalog-resource: classpath:programs.json
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  payments:
    enabled: ${COURSE_PAYMENTS_ENABLED:false}
    client-key: ${TOSS_CLIENT_KEY:}
    secret-key: ${TOSS_SECRET_KEY:}
